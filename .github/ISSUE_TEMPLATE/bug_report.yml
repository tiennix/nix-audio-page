name: Bug report
description: Something in NIX Audio does not work as documented.
labels: [bug]
body:
  - type: input
    id: unity
    attributes:
      label: Unity version
      placeholder: 2022.3.62f1
    validations:
      required: true
  - type: dropdown
    id: pipeline
    attributes:
      label: Render pipeline
      options: [Built-in, URP, HDRP, Other]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: NIX Audio version
      placeholder: 1.0.0
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Console log (with stack trace)
      render: text
